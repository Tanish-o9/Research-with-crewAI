[project]
name = "researcher"
version = "0.1.0"
description = "researcher using crewAI"
authors = [{ name = "Tanish-o9", email = "tanishrajput673@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.0",
    "crewai[google-genai]>=1.15.0",
    "google-genai>=0.1.1",
    "google-generativeai>=0.8.0",
    "litellm>=1.40.0",
    "duckduckgo-search>=7.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "gTTS>=2.5.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
researcher = "researcher.main:run"
run_crew = "researcher.main:run"
train = "researcher.main:train"
replay = "researcher.main:replay"
test = "researcher.main:test"
run_with_trigger = "researcher.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
