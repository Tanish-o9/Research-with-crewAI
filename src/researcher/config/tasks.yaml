research_task:
  description: >
    Conduct an investigation on {topic} considering the current year is {current_year}.
    Research Depth: {research_depth}.
    Target Tone: {research_tone}.
    {knowledge_context}
    1. Use the live web search tool to find the most recent trends, breakthroughs, real-world metrics, and expert insights.
    2. When you discover authoritative or high-signal URLs, use the 'read_webpage_content' tool to scrape and deeply read their content for hard facts and citations.
    3. Synthesize the top critical findings with clear evidence, statistics, and source URLs.
  expected_output: >
    A list of verified, structured findings on {topic}, each containing a title, analytical breakdown, metrics,
    and direct source URLs.
  agent: researcher

reporting_task:
  description: >
    Review the research findings from the research task and synthesize them into an engaging,
    well-structured draft report maintaining a {research_tone} tone and {research_depth} level of depth.
    If internal documents were provided in the background knowledge, cross-reference them with web findings.
    Expand each finding into an analytical chapter with historical context, industry impact, and future outlook.
  expected_output: >
    A comprehensive multi-section draft report covering all findings in clear, engaging Markdown format.
  agent: reporting_analyst

review_task:
  description: >
    Carefully review and audit the draft report. Ensure strict factual integrity, eliminate repetition,
    and adhere strictly to the requested {research_tone} tone.
    Add a top-level # Executive Summary, a structured ## Key Takeaways section, and an actionable
    ## Strategic Recommendations & Outlook at the end.
    Ensure professional Markdown formatting without code fences ('```').
  expected_output: >
    A publication-ready, polished Markdown report complete with Executive Summary,
    in-depth sections, Key Takeaways, Citations, and Strategic Recommendations.
  agent: fact_checker
